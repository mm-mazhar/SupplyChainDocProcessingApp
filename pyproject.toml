[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "google-genai>=2.14.0",
    "jinja2>=3.1.6",
    "openai>=2.47.0",
    "paddleocr>=3.7.0",
    "pdfplumber>=0.11.10",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.0",
    "hypothesis>=6.161.2",
    "pytest>=9.1.1",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require real file I/O)",
]
