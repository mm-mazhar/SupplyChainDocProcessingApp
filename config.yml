ai:
  normalization:
    # Primary model for data normalization
    primary:
      provider: gemini
      model: gemini-3.1-flash-lite
      temperature: 0
      response_mime_type: application/json

    # Fallback model if primary fails
    fallback:
      provider: openrouter
      model: meta-llama/llama-3-8b-instruct:free
      base_url: https://openrouter.ai/api/v1
      temperature: 0

    # System prompt used by both models
    system_prompt: "You clean and normalize supply chain data. Output ONLY JSON, with no explanation."
